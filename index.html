function b2u(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function dec(pin){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(S),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(I)},key,b2u(C));
  return new TextDecoder().decode(pt);
}
async function unlock(autoPin){
  const pin=autoPin||document.getElementById('pin').value.trim();
  const err=document.getElementById('err');
  if(!pin) return;
  try{
    const html=await dec(pin);
    try{localStorage.setItem(K,pin);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    if(autoPin){try{localStorage.removeItem(K);}catch(x){}}
    else err.textContent='비밀번호가 맞지 않아요.';
  }
}
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter') unlock();});
(function(){try{const saved=localStorage.getItem(K);if(saved) unlock(saved);}catch(e){}})();
